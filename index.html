<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZC Hub - Official Scripts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        .logo-glow { font-size: 28px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; text-shadow: 0 0 15px rgba(56,189,248,0.5); }
        .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 30px; }
        .section-title { font-size: 16px; font-weight: 600; text-align: left; margin-bottom: 12px; color: #cbd5e1; }
        .script-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        .script-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .script-info { text-align: left; }
        .script-name { font-size: 16px; font-weight: bold; color: #f1f5f9; margin-bottom: 4px; }
        .script-desc { font-size: 12px; color: #94a3b8; }
        .lock-badge { font-size: 18px; }
        .footer { margin-top: 30px; font-size: 12px; color: #64748b; }
        .footer span { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-glow">AZC Hub</div>
        <div class="subtitle">Official Scripts Library</div>
        
        <div class="section-title">My Scripts</div>
        
        <div class="script-card" onclick="requestKey('https://dazzling-salamander-ffa568.netlify.app/azc.lua')">
            <div class="script-info">
                <div class="script-name">AZC Hub (Main)</div>
                <div class="script-desc">Protected & Encrypted Script</div>
            </div>
            <div class="lock-badge">🔒</div>
        </div>

        <div class="footer">
            Discord: <span>a0nlvd</span>
        </div>
    </div>
</body>
</html>
